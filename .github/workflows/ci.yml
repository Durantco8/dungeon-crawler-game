name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      # The badge is written by this workflow. Ignoring it stops a badge update triggering another run.
      - ".github/badges/**"
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    # Committing the refreshed badge needs write access, but only on the default branch.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run the tests
        # The JaCoCo report and its coverage floor are both bound to the test phase, so this one command
        # runs the suite, produces the report, and fails if coverage has slipped.
        run: ./mvnw -B --no-transfer-progress clean test

      - name: Summarise coverage
        id: coverage
        run: |
          PERCENT=$(.github/scripts/coverage-badge.sh)
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
          {
            echo "### Coverage"
            echo ""
            echo "Line coverage outside the JavaFX view: **${PERCENT}%**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error

      - name: Upload the test reports
        # Kept even when the build fails, since that is when they are worth reading.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Commit the coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "Coverage is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "chore: update coverage badge to ${{ steps.coverage.outputs.percent }}% [skip ci]"
          git push

  simulate:
    name: Simulation smoke run
    runs-on: ubuntu-latest
    # The harness is the only thing that exercises a few hundred whole games end to end, so a short run
    # here catches a regression the unit tests would not notice.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: ./mvnw -B --no-transfer-progress clean compile

      - name: Play 100 games and report
        run: |
          java -cp target/classes com.durantco.dungeon.sim.Simulate --games 100 --hard \
            | tee "$GITHUB_STEP_SUMMARY"
